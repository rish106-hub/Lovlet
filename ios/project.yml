name: CouplesMVP
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  CouplesMVP:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CouplesMVP
        UILaunchScreen: {}
        SUPABASE_URL: "https://$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/CouplesMVP.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.couples
    dependencies:
      - package: supabase-swift
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.couplesmvp
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "Apple Development"

  PartnerMomentWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - App/Models
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PartnerMomentWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PartnerMomentWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.couples
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.couplesmvp.widget
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

schemes:
  CouplesMVP:
    build:
      targets:
        CouplesMVP: all
        PartnerMomentWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
